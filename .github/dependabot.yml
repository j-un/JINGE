# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # Keep TypeScript on its own PR so a major bump cannot land with
      # eslint/typescript-eslint (those still peer-depend on TypeScript 6.x).
      typescript:
        patterns:
          - "typescript"
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      # @typescript-eslint/* 8.x still peers typescript ">=4.8.4 <6.1.0".
      # Dependabot otherwise tries 7.x, fails peer resolution
      # (dependency_file_not_resolvable), and the updater check on main goes
      # red. Remove once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        versions: [">=7.0.0"]
